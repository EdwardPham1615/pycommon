name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only by default. Nothing here publishes anything, and a workflow that
# can write to the repo is a workflow an injected dependency can write with.
permissions:
  contents: read

# A new push makes the in-flight run for the same ref obsolete; cancelling it
# frees a runner instead of racing to report on code nobody is looking at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest

    # A real Redis for tests/integration. The rest of the suite uses fakeredis,
    # which does not faithfully model Lua execution, server-side TIME or key
    # expiry -- the three things the rate limiters, the lock and the cache
    # actually depend on. No password: nothing here is worth protecting, and a
    # secret would only have to be shared with every contributor.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_TEST_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync
        run: uv sync --extra all --extra dev

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy src/pycommon

      # Coverage threshold lives in pyproject.toml, so this command and
      # `make test-cov` enforce the same number.
      # REDIS_TEST_URL above turns the integration suite on. Locally it is unset
      # and those tests skip, so `make test` stays offline; `make test-integration`
      # opts in.
      - name: Test
        run: uv run pytest --cov=pycommon --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # Audits the resolved lockfile rather than the loosest versions the
      # constraints allow, so this reports what consumers would actually get.
      - name: Export locked dependencies
        run: >
          uv export --frozen --extra all --no-dev --no-emit-project
          --format requirements-txt -o requirements-audit.txt

      # A separate job: a vulnerability advisory is news about the world, not a
      # defect in the pull request, and it should not mask a lint or test result.
      - name: Audit dependencies
        run: uvx pip-audit --requirement requirements-audit.txt --disable-pip
